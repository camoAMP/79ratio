name: Build and deploy

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

env:
  NODE_VERSION: '20'

jobs:
  build-and-deploy:
    name: Build and (optionally) deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Wrangler version (requires CLOUDFLARE_API_TOKEN)
        if: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "Using wrangler: $(npx --yes wrangler --version)"
          npx --yes wrangler versions upload

      - name: Deploy to Cloudflare Pages (production only; requires CLOUDFLARE_API_TOKEN)
        if: ${{ secrets.CLOUDFLARE_API_TOKEN && github.ref == 'refs/heads/main' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Deploying production Pages site for branch main to project '79ratiocom' (account: ${CLOUDFLARE_ACCOUNT_ID})"
          npx --yes wrangler pages deploy .open-next --project-name 79ratiocom --branch main --account-id ${CLOUDFLARE_ACCOUNT_ID}

      - name: Deploy preview to Cloudflare Pages (non-main branches; requires CLOUDFLARE_API_TOKEN)
        if: ${{ secrets.CLOUDFLARE_API_TOKEN && github.ref != 'refs/heads/main' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Deploying preview Pages site for branch ${GITHUB_REF_NAME:-${GITHUB_REF}} to project '79ratiocom' (account: ${CLOUDFLARE_ACCOUNT_ID})"
          npx --yes wrangler pages deploy .open-next --project-name 79ratiocom --branch "${{ github.ref_name }}" --account-id ${CLOUDFLARE_ACCOUNT_ID}

      - name: Success message
        run: echo "Build finished. Deploy ran for main if token was available."
